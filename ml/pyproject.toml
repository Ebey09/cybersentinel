[project]
name = "cybersentinel-ml"
version = "0.1.0"
description = "CyberSentinel ML: data contract, training, evaluation and XAI for network flow classification"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ebey" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
cybersentinel-ml = "cybersentinel_ml.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cybersentinel_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["cybersentinel_ml"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: isort, B: bugbear, UP: pyupgrade, S: bandit security rules,
# BLE: blind except, C4: comprehensions, SIM: simplifications, RUF: ruff-specific
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

# Dataset registry. Nothing here is downloaded automatically.
# CIC datasets are obtained from UNB CIC by the user; this repo never redistributes them.
# Fill in `files` (name + sha256) after download with: sha256sum <file>   (Phase 4 adds a helper)
# Every value marked [VERIFY] must be confirmed before a schema is set to `verified`.

datasets:
  - id: cic_ids2017_corrected
    track: A
    name: CNS2022 Improved CIC-IDS2017 (Liu, Engelen et al.), published CSV release
    release: "CICIDS2017_improved.zip from https://intrusion-detection.distrinet-research.be/CNS2022/Datasets/ (ADR 0012)"
    extractor_commit: "unknown / not documented (V8). Author tool identified, exact generation commit not published."
    labelling: "https://github.com/GintsEngelen/CNS2022_Code Labelling/CICIDS2017_labelling_fixed_CICFlowMeter.ipynb. Known revision 7f862bf6f9dcd5b327dfeaff0d68ff29256fb871, not confirmed as the release revision (V26)."
    extraction_settings: "offline mode, flow timeout 120000000 us, activity timeout 5000000 us, pcapfix then reordercap (CNS2022_Code README)"
    original_homepage: https://www.unb.ca/cic/datasets/ids-2017.html
    correction_code: https://github.com/GintsEngelen/WTMC2021-Code
    correction_code_2022: https://github.com/GintsEngelen/CNS2022_Code
    extractor: https://github.com/GintsEngelen/CICFlowMeter
    acquisition:
      used: "Published CNS2022 CSV release (CICIDS2017_improved.zip). Keep the archive as downloaded."
      alternative: "Regenerate from the UNB CIC-IDS2017 PCAPs with a pinned fork commit. Not used now; the path if exact provenance becomes necessary (ADR 0012)."
    terms: "[VERIFY] read the UNB CIC terms of use on the dataset page and the correction project's terms. Do not commit dataset rows to git."
    citations:
      - "Sharafaldin, Habibi Lashkari, Ghorbani. Toward Generating a New Intrusion Detection Dataset and Intrusion Traffic Characterization. ICISSP 2018."
      - "Engelen, Rimmer, Joosen. Troubleshooting an Intrusion Detection Dataset: the CICIDS2017 Case Study. IEEE SPW (WTMC) 2021."
      - "Liu, Engelen, Lynar, Essam, Joosen. Error Prevalence in NIDS datasets: A Case Study on CIC-IDS-2017 and CSE-CIC-IDS-2018. IEEE CNS 2022."
    # V7 (partial, still open for Track B): SHA-256 and row counts of the five CSVs verified locally by the project owner.
    # The archive hash was hashed earlier by the project owner and was not re-hashed in that verification step.
    files:
      - {name: CICIDS2017_improved.zip, sha256: 97fdb91d339e2d8cf5627f981b831e5e7e400b981c58181c451a38fd03c48883, sha256_status: previously_recorded_not_reverified}
      - {name: monday.csv, sha256: 51fe5dc962626efb4ae70dce0303072fb780da0932822b651202ee9c2fbc1aff, rows: 371624, sha256_status: verified}
      - {name: tuesday.csv, sha256: e2a0a5b631dfc6b455cc9f9a88b944110637d70a7f74171473925f76f38b6b0c, rows: 322078, sha256_status: verified}
      - {name: wednesday.csv, sha256: bf46c5f3c792e8817381f724511229569606918eaf07ac986d7a2592b6341bc2, rows: 496641, sha256_status: verified}
      - {name: thursday.csv, sha256: 78a4d11eaf473d099e30e71ddb01e0f38218e844c0a9cdd36602145d674af482, rows: 362076, sha256_status: verified}
      - {name: friday.csv, sha256: ebd499e6f23bd59f9cb81bec28178491b02b925fa5640a24215c9437d79482d0, rows: 547557, sha256_status: verified}

  - id: cic_darknet2020
    track: B
    name: CIC-Darknet2020
    original_homepage: https://www.unb.ca/cic/datasets/darknet2020.html
    extractor: "CICFlowMeter, upstream (https://github.com/ahlashkari/CICFlowMeter). [VERIFY] V25 exact version: not documented in the sources checked. If it stays undocumented, record it as not_documented (ADR 0010), never guess."
    acquisition:
      option_1: "Download the CSV from UNB CIC (registration form). Published file: Darknet.CSV with Darknet.md5."
    terms: "Per the official dataset page (text supplied by the project owner): the dataset may be redistributed, republished and mirrored, provided the use or redistribution includes the required CICDarknet2020 citation and the DIDarknet paper citation. Do not commit dataset rows to git."
    citations:
      - "Habibi Lashkari, Kaur, Rahali. DIDarknet: A Contemporary Approach to Detect and Characterize the Darknet Traffic using Deep Image Learning. ICCNS 2020. [VERIFY] citation text on the dataset page."
    # MD5: the publisher's value (Darknet.md5) matched an independently computed MD5.
    # SHA-256: independently computed by the project owner (the publisher gives no SHA-256).
    files:

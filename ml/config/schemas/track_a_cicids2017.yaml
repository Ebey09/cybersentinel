# Feature schema: Track A (attack detection, corrected CIC-IDS2017)
# Source of truth for training AND inference. Validated by cybersentinel_ml.contract.
# status: draft -> training and inference refuse to run until it is 'verified'.
# Column list taken from FlowFeature.java in github.com/GintsEngelen/CICFlowMeter (master, 94 columns incl. Label).

schema_id: track_a.cicids2017_corrected
schema_version: 0.1.0
status: draft
track: A
title: 'Track A: Attack detection (corrected CIC-IDS2017)'
dataset:
  name: CIC-IDS2017, corrected by Engelen et al. (WTMC 2021)
  homepage: https://www.unb.ca/cic/datasets/ids-2017.html
  correction: https://github.com/GintsEngelen/WTMC2021-Code
  release: '[VERIFY] which corrected release is used (WTMC 2021 labelling, or CNS 2022 improved version) and where
    the CSVs come from'
extractor:
  name: CICFlowMeter (Engelen et al. fork)
  repository: https://github.com/GintsEngelen/CICFlowMeter
  commit: '[VERIFY] pin the exact commit used to build the extractor image'
  flow_timeout_us: 120000000
  activity_timeout_us: 5000000
  pcap_preprocessing: []
  known_header_columns: 94
  notes: Timeouts are the defaults stated in the Engelen READMEs. The CNS 2022 pipeline also ran pcapfix and reordercap
    before extraction; add them here if that release is used.
parity:
  status: not_demonstrated
  evidence: null
  required_for:
  - pcap_inference
  test: docs/adr/0006-pcap-feature-parity-is-mandatory.md

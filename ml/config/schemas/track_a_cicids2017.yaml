preprocessing:
  version: 0.1.0
  inf_handling: Replace +Infinity and -Infinity with NaN.
  out_of_range_handling: Values outside expected_range become NaN and are counted per class in the data report.
  missing_handling: NaN replaced by the per-feature median of the TRAINING split (fitted, stored in the preprocessing
    artifact).
  derived_features:
  - name: zero_duration_flag
    dtype: float64
    definition: 1.0 if flow_duration == 0 else 0.0
    reason: Rate features are undefined for zero-duration flows. The flag keeps that information after imputation.
    pcap_available: same as flow_duration
  duplicate_handling: Drop exact duplicate rows (features + label) before splitting. Rows with identical features
    but different labels are dropped and reported as label conflicts.
  constant_feature_handling: Features constant on the TRAINING split are dropped. The dropped list is stored in
    the preprocessing artifact, so inference drops the same ones.
  scaling:
    logistic_regression: signed_log1p(x) = sign(x) * log1p(|x|), then StandardScaler fitted on training split
    tree_models: none
  categorical_encoding: 'protocol: one-hot over fixed categories + ''other''. dst_port: numeric, tree models only.'
  dtype_policy: All model inputs are cast to float64 after validation. Non-numeric values in a numeric column fail
    validation (the row is not silently coerced).
  feature_order: Model input order = order of `features` below, minus constant-dropped features, plus derived features
    appended in listed order. The final order is stored in the preprocessing artifact and checked at inference.
output_vocabulary:
  allowed_terms:
  - benign
  - attack
  - attack category
  - suspected
  - confidence
  notes: Class names shown to users must come from label_maps in the experiment config, which map only to labels
    present in the dataset.

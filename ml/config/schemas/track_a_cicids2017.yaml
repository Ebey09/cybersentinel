identifier_columns:
- name: flow_id
  source_column: Flow ID
  dtype: string
  used_for:
  - display
  - alert_rules
  - related_flows
  model_input: false
  reason: Identifier. Encodes IPs and ports, so it would leak lab topology into the model.
- name: src_ip
  source_column: Src IP
  dtype: string
  used_for:
  - display
  - alert_rules
  - related_flows
  model_input: false
  reason: Lab-specific. Attacker and victim IPs are fixed in the capture, so the model would learn addresses, not
    behaviour. Kept for display and alert rules only.
- name: src_port
  source_column: Src Port
  dtype: int64
  used_for:
  - display
  - alert_rules
  - related_flows
  model_input: false
  reason: Ephemeral client port, mostly random noise, and a potential session identifier.
- name: dst_ip
  source_column: Dst IP
  dtype: string
  used_for:
  - display
  - alert_rules
  - related_flows
  model_input: false
  reason: Lab-specific, same reason as Src IP. Kept for display and alert rules only.
- name: timestamp
  source_column: Timestamp
  dtype: string
  used_for:
  - display
  - alert_rules
  - related_flows
  model_input: false
  reason: Labels were assigned by time window, so time is a direct label proxy. Kept for display, related-flow lookup
    and timelines only.
label_columns:
- source_column: Label
  name: label
  known_values_source: WTMC2021-Code labelling_CSV_flows.py and MakeDataNumpyFriendly.py
features:
- name: dst_port
  source_column: Dst Port
  dtype: int64
  unit: null
  group: port
  meaning: Destination transport port.
  expected_range:
    min: 0
    max: 65535
  missing_values: reject_row
  scaling:
    logistic_regression: excluded
    tree_models: none
  encoding: numeric_trees_only
  included: true
  status: draft
  notes: Kept for tree models only (a port number is not a linear quantity). Every experiment also runs a no-port
    ablation to detect port shortcut learning.
  pcap_available: pinned_extractor_only
  source: CICFlowMeter, Engelen et al. fork (pinned commit)
- name: protocol
  source_column: Protocol
  dtype: int64
  unit: null
  group: categorical
  meaning: IANA IP protocol number (6 = TCP, 17 = UDP).
  expected_range:
    min: 0
    max: 255
  missing_values: reject_row
  scaling:
    logistic_regression: none
    tree_models: none
  encoding: one_hot_fixed_categories
  included: true
  status: draft
  notes: '[VERIFY] observed protocol values in the real CSV (CICFlowMeter may emit 0 for non-TCP/UDP).'
  pcap_available: pinned_extractor_only
  source: CICFlowMeter, Engelen et al. fork (pinned commit)
  categories:
  - 6
  - 17
  unknown_category: other
- name: flow_duration
  source_column: Flow Duration
  dtype: float64
  unit: microseconds
  group: time
  meaning: Time between the first and last packet of the flow.
  expected_range:
    min: 0
    max: null
  missing_values: inf_to_nan_then_train_median
  scaling:
    logistic_regression: signed_log1p_then_standard
    tree_models: none
  encoding: numeric
  included: true
  status: draft
  notes: null
  pcap_available: pinned_extractor_only

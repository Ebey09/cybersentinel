# Track A, binary: benign vs attack on the CNS2022 Improved CIC-IDS2017 release (ADR 0012).
# Consumed by training/evaluation from Phase 5. Validated now by tests.
# Keys are the raw Label strings observed in the five CNS2022 CSVs (V5), spelled exactly as in the files.
# '- Attempted' flows map to BENIGN, following Engelen et al. and CNS2022. No Attempted class. See docs/adr/0004.
experiment_id: track_a_binary_v0
track: A
schema_path: ml/config/schemas/track_a_cicids2017.yaml
task: binary
seed: 42
label_column: Label
label_map:
  BENIGN: BENIGN
  FTP-Patator: ATTACK
  FTP-Patator - Attempted: BENIGN
  SSH-Patator: ATTACK
  SSH-Patator - Attempted: BENIGN
  DoS Hulk: ATTACK
  DoS Hulk - Attempted: BENIGN
  DoS GoldenEye: ATTACK
  DoS GoldenEye - Attempted: BENIGN
  DoS Slowloris: ATTACK
  DoS Slowloris - Attempted: BENIGN
  DoS Slowhttptest: ATTACK
  DoS Slowhttptest - Attempted: BENIGN
  Heartbleed: ATTACK
  Web Attack - SQL Injection: ATTACK
  Web Attack - SQL Injection - Attempted: BENIGN
  Web Attack - XSS: ATTACK
  Web Attack - XSS - Attempted: BENIGN
  Web Attack - Brute Force: ATTACK
  Web Attack - Brute Force - Attempted: BENIGN
  Infiltration: ATTACK
  Infiltration - Attempted: BENIGN
  # CyberSentinel taxonomy decision: the CNS2022 documentation places this label under the Infiltration
  # scenario's "NMAP Portscan" section and describes the activity as a portscanning attack. Grouping it
  # into PORTSCAN is our choice based on that description; CNS2022 does not define our families.
  Infiltration - Portscan: ATTACK
  Portscan: ATTACK
  Botnet: ATTACK
  Botnet - Attempted: BENIGN
  DDoS: ATTACK
  DDoS - Attempted: BENIGN
class_display:
  BENIGN: Benign
  ATTACK: Attack (matches attack patterns in CIC-IDS2017)
unknown_label_policy: fail
min_class_count: null
include_dst_port: true
split:
  method: stratified_random
  train: 0.7
  validation: 0.15
  test: 0.15
  dedup_before_split: true
models:
- algorithm: logistic_regression
  params:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
- algorithm: random_forest
  params:
    n_estimators: 200
    min_samples_leaf: 1
    class_weight: balanced_subsample
    max_samples: 0.5
    n_jobs: -1
- algorithm: xgboost
  params:
    n_estimators: 600
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    early_stopping_rounds: 30
calibration:
  method: isotonic
  fit_on: validation
threshold:
  policy: target_fpr
  target_fpr: 0.001
  fit_on: validation
ablations:
- no_dst_port
- shuffled_labels
- single_feature_auc
notes: target_fpr 0.001 = about 1 false alert per 1,000 benign flows on the validation split. Starting point, revisit
  after EDA.

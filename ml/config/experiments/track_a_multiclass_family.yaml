# Track A, multi-class by attack family on the CNS2022 Improved CIC-IDS2017 release (ADR 0012).
# Keys are the raw Label strings observed in the five CNS2022 CSVs (V5), spelled exactly as in the files.
# Families are CyberSentinel's grouping; every group is traceable to the raw labels below.
# '- Attempted' flows map to BENIGN. No Attempted class. Attempted Category is never a target or feature.
# Classes with fewer than min_class_count TRAINING samples are reported as 'insufficient data'
# and removed from this task (they stay in the binary task). [VERIFY] V7/V18 counts.
experiment_id: track_a_multiclass_family_v0
track: A
schema_path: ml/config/schemas/track_a_cicids2017.yaml
task: multiclass_family
seed: 42
label_column: Label
label_map:
  BENIGN: BENIGN
  FTP-Patator: CREDENTIAL_BRUTE_FORCE
  FTP-Patator - Attempted: BENIGN
  SSH-Patator: CREDENTIAL_BRUTE_FORCE
  SSH-Patator - Attempted: BENIGN
  DoS Hulk: DOS
  DoS Hulk - Attempted: BENIGN
  DoS GoldenEye: DOS
  DoS GoldenEye - Attempted: BENIGN
  DoS Slowloris: DOS
  DoS Slowloris - Attempted: BENIGN
  DoS Slowhttptest: DOS
  DoS Slowhttptest - Attempted: BENIGN
  Heartbleed: HEARTBLEED
  Web Attack - SQL Injection: WEB_ATTACK
  Web Attack - SQL Injection - Attempted: BENIGN
  Web Attack - XSS: WEB_ATTACK
  Web Attack - XSS - Attempted: BENIGN
  Web Attack - Brute Force: WEB_ATTACK
  Web Attack - Brute Force - Attempted: BENIGN
  Infiltration: INFILTRATION
  Infiltration - Attempted: BENIGN
  # CyberSentinel taxonomy decision: the CNS2022 documentation places this label under the Infiltration
  # scenario's "NMAP Portscan" section and describes the activity as a portscanning attack. Grouping it
  # into PORTSCAN is our choice based on that description; CNS2022 does not define our families.
  Infiltration - Portscan: PORTSCAN
  Portscan: PORTSCAN
  Botnet: BOTNET
  Botnet - Attempted: BENIGN
  DDoS: DDOS
  DDoS - Attempted: BENIGN
class_display:
  BENIGN: Benign
  CREDENTIAL_BRUTE_FORCE: Brute force against FTP/SSH (FTP-Patator, SSH-Patator)
  DOS: Denial of service (Hulk, GoldenEye, Slowloris, Slowhttptest)
  DDOS: Distributed denial of service
  PORTSCAN: Port scan (includes the Nmap port scans in the Infiltration scenario)
  WEB_ATTACK: Web attack (brute force, XSS, SQL injection)
  BOTNET: Botnet traffic
  INFILTRATION: Infiltration
  HEARTBLEED: Heartbleed exploitation
unknown_label_policy: fail
min_class_count: 100
include_dst_port: true
split:
  method: stratified_random
  train: 0.7
  validation: 0.15
  test: 0.15
  dedup_before_split: true
models:
- algorithm: logistic_regression
  params:
    C: 1.0
    max_iter: 2000
    class_weight: balanced
- algorithm: random_forest
  params:
    n_estimators: 200
    min_samples_leaf: 1
    class_weight: balanced_subsample
    max_samples: 0.5
    n_jobs: -1
- algorithm: xgboost
  params:
    n_estimators: 600
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
    early_stopping_rounds: 30
calibration:
  method: isotonic
  fit_on: validation
threshold:
  policy: argmax
  target_fpr: null
  fit_on: validation
ablations:
- no_dst_port
- shuffled_labels
notes: Display text is deliberately generic. Check the CIC-IDS2017 page before adding tool names.
